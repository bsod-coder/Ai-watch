name: Build APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build phone app APKs (per-ABI + universal)
        run: gradle :app:assembleDebug --stacktrace

      - name: Build watch app APKs (per-ABI + universal)
        run: gradle :wear:assembleDebug --stacktrace

      - name: Collect phone APKs
        run: |
          mkdir -p out/phone
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/phone/ \;

      - name: Collect watch APKs
        run: |
          mkdir -p out/watch
          find wear/build/outputs/apk -name "*.apk" -exec cp {} out/watch/ \;

      - name: Upload phone APKs
        uses: actions/upload-artifact@v4
        with:
          name: phone-apks
          path: out/phone/*.apk

      - name: Upload watch APKs
        uses: actions/upload-artifact@v4
        with:
          name: watch-apks
          path: out/watch/*.apk
