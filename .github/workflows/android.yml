name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  # ------------------------------------------------------------------ checks
  verify:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Project consistency checks
        run: python3 scripts/verify_project.py

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

  # ------------------------------------------------------------------- build
  build:
    name: Build ${{ matrix.target.label }} APKs
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        target:
          - module: app
            label: phone
          - module: wear
            label: wear
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # A throwaway key so the output is an installable signed APK rather than
      # *-unsigned.apk. Replace with repository secrets for a real release:
      #   secrets.AIWATCH_KEYSTORE_BASE64, _PASSWORD, _ALIAS, _KEY_PASSWORD
      - name: Provision signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AIWATCH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AIWATCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AIWATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AIWATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/aiwatch-release.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using the release keystore from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$STORE"
          else
            echo "No secrets configured - generating a throwaway CI keystore."
            keytool -genkeypair -v \
              -keystore "$STORE" \
              -alias aiwatch \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AiWatch CI, OU=CI, O=AiWatch, L=CI, S=CI, C=US"
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=aiwatch
            KEY_PASSWORD=android
          fi
          {
            echo "AIWATCH_KEYSTORE_PATH=$STORE"
            echo "AIWATCH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AIWATCH_KEY_ALIAS=$KEY_ALIAS"
            echo "AIWATCH_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble release APKs
        run: ./gradlew :${{ matrix.target.module }}:assembleRelease --stacktrace

      - name: Show what was produced
        run: ls -lh ${{ matrix.target.module }}/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: aiwatch-${{ matrix.target.label }}-apks
          path: ${{ matrix.target.module }}/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
